# A minimal native ztmux plugin: one command, one `#{…}` format, one hook.
#
# A real plugin lives in its own repository and depends on the published
# `ztnative` crate; this one is inside the ztmux tree, so it points at the
# local copy of the SDK and declares its own `[workspace]` to stay out of
# ztmux's.
[package]
name    = "plugin-hello"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
# The one thing that makes a crate loadable: a C-ABI dynamic library.
crate-type = ["cdylib"]

[dependencies]
ztnative = { path = "../../ztnative" }
